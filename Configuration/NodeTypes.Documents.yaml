
'UpAssist.Neos.News:Document':
  abstract: true
  superTypes:
    'TYPO3.Neos:Document': true
'UpAssist.Neos.News:Article':
  superTypes:
    'UpAssist.Neos.News:Document': true
    'TYPO3.Neos.NodeTypes:TitleMixin': true
  ui:
    label: News
    icon: icon-file-text-alt
  childNodes:
    main:
      type: 'TYPO3.Neos:ContentCollection'
  properties:
    _hiddenInIndex:
      defaultValue: false
    publicationDate:
      type: DateTime
      ui:
        label: 'Publication Date'
        inspector:
          group: document
          editorOptions:
            format: 'd-m-Y H:i'
      validation:
        TYPO3.Neos/Validation/NotEmptyValidator: {  }
        TYPO3.Neos/Validation/DateTimeValidator: {  }
      search:
        elasticSearchMapping:
          type: date
          include_in_all: false
          format: date_time_no_millis
        indexing: '${(node.properties.publicationDate ? Date.format(node.properties.publicationDate, "Y-m-d\TH:i:sP") : null)}'
'UpAssist.Neos.News:Index':
  superTypes:
    'UpAssist.Neos.News:Document': true
  childNodes:
    main:
      type: 'TYPO3.Neos:ContentCollection'
  ui:
    label: 'News Index'
    icon: icon-list
  properties:
    title:
      defaultValue: News
